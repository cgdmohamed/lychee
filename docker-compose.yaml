services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Not `ports:` — that binds the host's network interface directly, which collides
    # with any other container on the same server also claiming that host port (the
    # actual cause behind "port is already allocated" deploy failures on a shared
    # Coolify host). Coolify's Traefik proxy reaches this container over the internal
    # `coolify` Docker network using SERVICE_FQDN_APP_4000 below, so no host bind is
    # needed there. `expose` just documents the container's internal port for other
    # containers on the same network — it doesn't publish anything to the host.
    # Running via plain `docker compose up` outside Coolify (no Traefik in front) needs
    # its own port mapping to reach the app from the host — see the README's Docker
    # section for a docker-compose.override.yaml snippet that adds one back.
    expose:
      - "4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@lycheesaudi.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD for the initial admin login}
      # Coolify-only: a "magic" variable it recognizes and auto-fills with a real
      # generated domain, wiring up its Traefik proxy + HTTPS to port 4000 on deploy.
      # Ignored (stays literally "/") by plain `docker compose up` outside Coolify.
      SERVICE_FQDN_APP_4000: /
    volumes:
      - lychee-data:/app/server/data
      - lychee-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lychee-data:
  lychee-uploads:
